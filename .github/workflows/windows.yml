name: Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:win
      - name: Install and launch the packaged application
        shell: pwsh
        run: |
          $installer = Get-Item release/Super-Advisory-Setup-*-x64.exe
          $destination = Join-Path $env:RUNNER_TEMP 'SuperAdvisorySmoke'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          node tools/windows-smoke.mjs "$destination/SuperAdvisory.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed application smoke check failed' }
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem release/Super-Advisory-Setup-*-x64.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: super-advisory-windows-x64
          path: |
            release/Super-Advisory-Setup-*-x64.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-startup-verification
          path: release/windows-startup.*
          if-no-files-found: ignore
